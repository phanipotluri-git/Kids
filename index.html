<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Global Edge School – Grade 3 | 30-Day Worksheet Pack</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#1a2744; --math:#1d4ed8; --mathL:#dbeafe;
  --eng:#047857; --engL:#d1fae5; --evs:#b45309; --evsL:#fef3c7;
  --tel:#6d28d9; --telL:#ede9fe; --hin:#be185d; --hinL:#fce7f3;
  --bg:#fffcf4; --border:#e2e8f0; --text:#1e293b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── TOP BAR ── */
.topbar{background:var(–navy);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.topbar-left h1{font-family:‘Fredoka One’,cursive;font-size:17px;letter-spacing:.4px;}
.topbar-left p{font-size:10px;opacity:.65;margin-top:1px;}
.print-btn{background:#f59e0b;color:#1a2744;border:none;padding:7px 16px;border-radius:6px;font-family:‘Nunito’,sans-serif;font-weight:800;font-size:12px;cursor:pointer;}
.print-btn:hover{background:#d97706;}

/* ── DAY NAV ── */
.daynav{background:#f1f5f9;border-bottom:1px solid var(–border);padding:10px 20px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.daynav-label{font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-right:6px;white-space:nowrap;}
.dbtn{width:29px;height:29px;border:2px solid #cbd5e1;background:#fff;border-radius:50%;font-size:11px;font-weight:800;color:#475569;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.dbtn:hover{border-color:var(–math);color:var(–math);}
.dbtn.active{background:var(–navy);border-color:var(–navy);color:#fff;}

/* ── WORKSHEET CONTAINER ── */
.ws-wrap{max-width:830px;margin:20px auto;padding:0 14px 60px;}

/* ── NAV ARROWS ── */
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.arrowbtn{background:var(–navy);color:#fff;border:none;padding:7px 14px;border-radius:6px;font-family:‘Nunito’,sans-serif;font-weight:700;font-size:12px;cursor:pointer;}
.arrowbtn:hover{background:#0f172a;}
.arrowbtn:disabled{background:#cbd5e1;color:#94a3b8;cursor:not-allowed;}
.day-pill{font-family:‘Fredoka One’,cursive;font-size:18px;color:var(–navy);}

/* ── WORKSHEET HEADER ── */
.ws-head{border:2px solid var(–navy);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.wsh-top{background:var(–navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:9px 18px;}
.wsh-school{font-family:‘Fredoka One’,cursive;font-size:19px;}
.wsh-year{font-size:13px;font-weight:700;}
.wsh-bottom{display:grid;grid-template-columns:1fr 1fr;}
.wsh-cell{padding:7px 16px;font-size:12px;font-weight:800;}
.wsh-cell:first-child{border-right:1px solid var(–navy);}
.wsh-cell span{font-weight:500;color:#475569;}

.ws-banner{background:#f8fafc;border:1.5px solid var(–border);border-radius:8px;padding:10px 16px;margin-bottom:12px;font-family:‘Fredoka One’,cursive;font-size:16px;color:var(–navy);}
.ws-note{background:#fefce8;border:1.5px solid #fde047;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;color:#713f12;margin-bottom:14px;}

/* ── SUBJECT BLOCKS ── */
.subj{margin-bottom:18px;border-radius:10px;overflow:hidden;border:1.5px solid;}
.subj.M{border-color:var(–math);}
.subj.E{border-color:var(–eng);}
.subj.V{border-color:var(–evs);}
.subj.T{border-color:var(–tel);}
.subj.H{border-color:var(–hin);}

.subj-hd{padding:9px 16px;color:#fff;font-family:‘Fredoka One’,cursive;font-size:16px;display:flex;justify-content:space-between;align-items:center;}
.subj.M .subj-hd{background:var(–math);}
.subj.E .subj-hd{background:var(–eng);}
.subj.V .subj-hd{background:var(–evs);}
.subj.T .subj-hd{background:var(–tel);}
.subj.H .subj-hd{background:var(–hin);}
.subj-topic{font-size:11px;font-weight:600;opacity:.85;}

.subj-body{padding:14px 16px;}
.subj.M .subj-body{background:var(–mathL);}
.subj.E .subj-body{background:var(–engL);}
.subj.V .subj-body{background:var(–evsL);}
.subj.T .subj-body{background:var(–telL);}
.subj.H .subj-body{background:var(–hinL);}

.ex{margin-bottom:14px;}
.ex:last-child{margin-bottom:0;}
.ex-head{font-size:12px;font-weight:900;color:#0f172a;margin-bottom:7px;line-height:1.4;}
.ex-items{list-style:none;padding:0;}
.ex-items li{font-size:12.5px;padding:4px 0 4px 16px;position:relative;border-bottom:1px dotted #94a3b8;line-height:1.6;}
.ex-items li:last-child{border-bottom:none;}
.ex-items li::before{content:”•”;position:absolute;left:0;color:#94a3b8;font-size:14px;}
.wp-box{background:#fff;border:1.5px dashed #94a3b8;border-radius:7px;padding:11px;font-size:12.5px;line-height:1.6;}
.wp-ans{font-weight:800;margin-top:7px;font-size:13px;}
.read-box{font-size:20px;letter-spacing:8px;padding:8px 0;line-height:2.2;font-weight:700;}
.draw-hint{border:1.5px dashed #94a3b8;border-radius:6px;height:65px;margin-top:7px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:11px;font-style:italic;}
.comp-passage{background:#fff;border-left:4px solid #cbd5e1;padding:10px 12px;font-size:12.5px;line-height:1.7;margin-bottom:10px;border-radius:0 6px 6px 0;}

/* ── PARENTS NOTE ── */
.pnote{background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:12px 16px;margin-top:16px;}
.pnote-title{font-size:13px;font-weight:900;color:#166534;margin-bottom:6px;}
.pnote ul{list-style:none;padding:0;}
.pnote ul li{font-size:11.5px;color:#166534;padding:2px 0 2px 18px;position:relative;}
.pnote ul li::before{content:“✓”;position:absolute;left:0;}
.ws-footer{text-align:center;font-size:10px;color:#94a3b8;font-style:italic;margin-top:14px;padding-top:10px;border-top:1px solid var(–border);}

/* ── PRINT ── */
@media print{
.topbar,.daynav,.nav-row,.print-btn{display:none!important;}
body{background:#fff;}
.ws-wrap{max-width:100%;margin:0;padding:0 8px;}
.subj-body{background:#fff!important;-webkit-print-color-adjust:exact;}
.subj-hd{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.wsh-top{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.subj{break-inside:avoid;}
.pnote{background:#fff!important;border:1px solid #ccc;}
.ws-note{background:#fffde7!important;-webkit-print-color-adjust:exact;}
}
</style>

</head>

let cur = 0;

function renderDay(i){
  const d = D[i];
  const isHindi = d.l2 === 'Hindi';
  const l2cls = isHindi ? 'H' : 'T';
  const l2icon = isHindi ? '🇮🇳' : '🌸';
  const l2label = isHindi ? 'Hindi (2nd Language)' : 'Telugu (2nd Language)';

  const subjectHTML = (cls, icon, label, data) => {
    if(!data) return '';
    let inner = '';

    // Handle "parts" array
    const parts = data.parts || [];
    parts.forEach(p => {
      inner += `<div class="ex"><div class="ex-head">${p.head}</div>`;

      if(p.read){
        inner += `<div class="read-box">${p.text.replace(/\n/g,'<br>')}</div>`;
      } else if(p.wp){
        inner += `<div class="wp-box"><div class="wp-text">📝 ${p.wp.text.replace(/\n/g,'<br><br>')}</div><div class="wp-ans">${p.wp.ans}</div></div>`;
      } else if(p.comp){
        inner += `<div class="comp-passage">${p.comp.pass}</div><ul class="ex-items">`;
        p.comp.qs.forEach(q => { inner += `<li>${q}<br><span style="display:block;margin-top:4px;border-bottom:1px solid #94a3b8;width:90%;height:14px;"></span></li>`; });
        inner += `</ul>`;
      } else if(p.draw){
        inner += `<div class="draw-hint">✏️ Draw here in your rough notebook</div>`;
      } else if(p.items){
        inner += `<ul class="ex-items">`;
        p.items.forEach(it => { inner += `<li>${it}</li>`; });
        inner += `</ul>`;
      }
      inner += `</div>`;
    });

    // Also handle top-level wp / comp (for days where parts wraps a single wp)
    if(data.wp){
      inner += `<div class="ex"><div class="wp-box"><div class="wp-text">📝 ${data.wp.text.replace(/\n/g,'<br><br>')}</div><div class="wp-ans">${data.wp.ans}</div></div></div>`;
    }
    if(data.comp){
      inner += `<div class="ex"><div class="comp-passage">${data.comp.pass}</div><ul class="ex-items">`;
      data.comp.qs.forEach(q => { inner += `<li>${q}<br><span style="display:block;margin-top:4px;border-bottom:1px solid #94a3b8;width:90%;height:14px;"></span></li>`; });
      inner += `</ul></div>`;
    }

    return `<div class="subj ${cls}">
      <div class="subj-hd">${icon} ${label}<span class="subj-topic">${data.topic || ''}</span></div>
      <div class="subj-body">${inner}</div>
    </div>`;
  };

  const html = `
    <div class="nav-row">
      <button class="arrowbtn" onclick="goDay(${i-1})" ${i===0?'disabled':''}>← Previous</button>
      <span class="day-pill">Worksheet ${i+1} of 30</span>
      <button class="arrowbtn" onclick="goDay(${i+1})" ${i===29?'disabled':''}>Next →</button>
    </div>
    <div class="ws-head">
      <div class="wsh-top">
        <span class="wsh-school">🏫 The Global Edge School</span>
        <span class="wsh-year">2026–27</span>
      </div>
      <div class="wsh-bottom">
        <div class="wsh-cell">Daily Plan &nbsp;|&nbsp; <span>Math, English, EVS &amp; ${d.l2}</span></div>
        <div class="wsh-cell">Class: 3 &nbsp;|&nbsp; <span>Worksheet ${i+1} of 30</span></div>
      </div>
    </div>
    <div class="ws-banner">📅 Plan for Worksheet ${i+1} — ${d.l2} Day</div>
    <div class="ws-note">📓 All written work to be done in a rough notebook unless otherwise stated.</div>

    ${subjectHTML('M','🔵','Math',d.math)}
    ${subjectHTML('E','🟢','English',d.english)}
    ${subjectHTML('V','🟠','EVS (Environmental Science)',d.evs)}
    ${subjectHTML(l2cls,l2icon,l2label,d.l2data)}

    <div class="pnote">
      <div class="pnote-title">📝 Instructions for Parents</div>
      <ul>
        <li>Allow short breaks between subjects.</li>
        <li>Encourage neat work — progress matters more than perfection.</li>
        <li>Support reading exercises but let the child try independently first.</li>
        <li>Oral activities marked "(Oral)" should be spoken aloud, not written.</li>
        <li>Drawing activities to be done in the rough notebook.</li>
      </ul>
    </div>
    <div class="ws-footer">The Global Edge School — <em>Ahead of the Learning Curve</em> &nbsp;|&nbsp; Grade 3 · Worksheet ${i+1} of 30</div>
  `;
  document.getElementById('wsArea').innerHTML = html;
}

function goDay(i){
  if(i<0||i>29) return;
  cur = i;
  document.querySelectorAll('.dbtn').forEach((b,idx)=>b.classList.toggle('active',idx===i));
  renderDay(i);
  window.scrollTo({top:0,behavior:'smooth'});
}

// Build nav
(function buildNav(){
  const nav = document.getElementById('daynav');
  for(let i=0;i<30;i++){
    const b = document.createElement('button');
    b.className='dbtn'+(i===0?' active':'');
    b.textContent=i+1;
    b.onclick=()=>goDay(i);
    nav.appendChild(b);
  }
})();

renderDay(0);
</script>

</body>
</html>
